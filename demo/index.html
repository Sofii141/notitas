<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notitas</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="barra">
  <div class="marca"><span class="logo">✿</span><h1>Notitas</h1></div>
  <div class="buscador"><input id="q" type="search" placeholder="Buscar (sin importar tildes)…" aria-label="Buscar notas"></div>
  <div class="acciones">
    <button id="btn-orden" class="boton suave" title="Ordenar por prioridad y fecha">↕ Prioridad</button>
    <button id="btn-deshacer" class="boton suave" title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
    <button id="btn-mas" class="boton suave" title="Más opciones">⋯</button>
    <button id="btn-nueva" class="boton principal">+ Nueva notita</button>
  </div>
  <div id="menu-mas" class="menu" hidden>
    <button data-accion="archivar">🗄 Archivar hechas (+7 días)</button>
    <button data-accion="archivadas">📦 Ver archivadas</button>
    <button data-accion="exportar">⬇ Exportar tablero</button>
    <label class="como-boton">⬆ Importar tablero<input id="importar" type="file" accept=".json" hidden></label>
  </div>
</header>

<section class="resumen">
  <div class="progreso"><div id="progreso-barra"></div></div>
  <span id="resumen-texto">—</span>
  <div id="filtros" class="filtros"></div>
  <span id="reglas" class="reglas" title="Reglas del backend ya implementadas (tareas t01–t24)"></span>
</section>

<main class="tablero">
  <section class="columna" data-columna="por_hacer"><h2>Por hacer <span class="cuenta"></span></h2><div class="notas"></div></section>
  <section class="columna" data-columna="en_curso"><h2>En curso <span class="cuenta"></span><small>WIP 3</small></h2><div class="notas"></div></section>
  <section class="columna" data-columna="hecho"><h2>Hecho <span class="cuenta"></span></h2><div class="notas"></div></section>
</main>

<dialog id="dlg-nueva" class="dialogo">
  <form method="dialog" id="form-nueva">
    <h3>Nueva notita</h3>
    <label>Título <input name="titulo" maxlength="120" required></label>
    <label>Contenido <textarea name="contenido" rows="3" placeholder="Usa **negrita** si quieres"></textarea></label>
    <div class="fila">
      <label>Prioridad <select name="prioridad"><option value="1">Baja</option><option value="2" selected>Media</option><option value="3">Alta</option></select></label>
      <label>Vence <input type="date" name="vence"></label>
    </div>
    <label>Responsable <input name="responsable" placeholder="Nombre y apellido"></label>
    <label>Etiquetas <input name="etiquetas" placeholder="separadas por coma"></label>
    <label>Checklist <input name="checklist" placeholder="pasos separados por coma"></label>
    <fieldset class="colores"><legend>Color</legend></fieldset>
    <div class="botones"><button value="cancelar" class="boton suave">Cancelar</button><button value="ok" class="boton principal">Pegar en el tablero</button></div>
  </form>
</dialog>

<dialog id="dlg-archivadas" class="dialogo">
  <h3>Archivadas</h3><ul id="lista-archivadas"></ul>
  <div class="botones"><button id="pag-ant" class="boton suave">‹</button><span id="pag-txt"></span><button id="pag-sig" class="boton suave">›</button><button id="cerrar-arch" class="boton principal">Cerrar</button></div>
</dialog>

<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
